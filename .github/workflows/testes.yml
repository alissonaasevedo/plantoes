name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sintaxe do JavaScript
        run: node --check js/app.js && node --check js/sw-register.js && node --check sw.js

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependências
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Testes do app (Playwright)
        run: pytest -q tests
